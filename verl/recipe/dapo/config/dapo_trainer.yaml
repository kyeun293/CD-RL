hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}
  # System message appended to prompts instructing the model to reason step by step.
  # Each step should be separated by step_sep (default: blank line).
  # Set to null to disable.
  step_instruction: "You MUST solve the problem using explicitly numbered steps.\n\nFORMAT — follow exactly:\nStep 1: <one sentence or equation — single action only>\nStep 2: <one sentence or equation — single action only>\nStep 3: <one sentence or equation — single action only>\n... (add more steps as needed)\nAnswer: final_answer\n\nRULES:\n- Minimum 3 steps. No maximum.\n- One step = one action (e.g., define a variable, write one equation, perform one simplification, state one conclusion). If you have two actions, use two steps.\n- Do NOT use markdown (###, **, etc.). Plain text only.\n- Answer: must appear alone on the last line, after all steps are done.\n\nEXAMPLE (short problem):\nStep 1: Let x be the unknown side length.\nStep 2: Write the area equation: x * (x+3) = 40.\nStep 3: Expand to get x² + 3x - 40 = 0.\nStep 4: Factor as (x+8)(x-5) = 0.\nStep 5: Since x > 0, the solution is x = 5.\nAnswer: 5"

reward:
  reward_manager:
    name: dapo
  reward_kwargs:
    overlong_buffer_cfg:
      enable: False # We try to avoid forgetting to set enable
      len: 0
      penalty_factor: 0.0
      log: False
    max_resp_len: null

algorithm:
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: False # We try to avoid forgetting to set enable
    metric: null # acc / score / seq_reward / seq_final_reward / ...
    max_num_gen_batches: 0 # Non-positive values mean no upper limit
  use_curiosity: True
  use_tokenlevel_curiosity: False  #SOO: token level ICM
  use_answerlevel_curiosity: False  #SOO: answer level ICM
  # Replace the fixed curiosity eta's (icm.eta / tokenlevel_icm.eta_token / answerlevel_icm.eta_answer)
  # with a per-prompt-group eta derived from each group's rollout-correctness std.
  # See RayDAPOTrainer._compute_curiosity_eta for details.
  variance_gated_curiosity: False
  # Multiplier applied on top of the dynamic (variance_gated_curiosity) eta, so that
  # total_reward = extrinsic_reward + dynamic_eta_coefficient * dynamic_eta * intrinsic_reward.
  # Only used when variance_gated_curiosity=True.
  dynamic_eta_coefficient: 1.0
  # Reshape the raw std-based dynamic eta with a saturating exponential transform before the
  # dynamic_eta_coefficient multiplier is applied:
  #   eta = x_max * (1 - exp(-dynamic_eta_beta * x / x_max)) / (1 - exp(-dynamic_eta_beta))
  # where x is the raw per-group std (in [0, x_max], x_max = 0.5 for even rollout.n) and eta
  # keeps f(0)=0, f(x_max)=x_max but rises toward x_max much faster for small-to-mid x. Larger
  # beta => faster saturation. Set to 0 (or null) to disable and use the raw std unchanged.
  dynamic_eta_beta: 5.0
  overload_actor_to_ref: False
  overload_actor_to_ref_freq: 40

actor_rollout_ref:
  use_curiosity: ${algorithm.use_curiosity}
  use_tokenlevel_curiosity: ${algorithm.use_tokenlevel_curiosity}  #SOO: token level ICM
  use_answerlevel_curiosity: ${algorithm.use_answerlevel_curiosity}  #SOO: answer level ICM
  step_sep: null # e.g. "Step"
  prm_model_path: null
  total_training_steps: null
  trust_remote_code: False
  ref_in_actor: False
  icm:
    icm_intermediate_size: 512
    lr: 1e-4
    lr_scheduler_type: "linear"
    warmup_steps: 0
    intrinsic_reward_token: "all_step_tokens" # "last_step_token" or "all_step_tokens"
    icm_calculation: "normalize" # "clip" or "normalize"
    eta: 0.5
    prm_mask: True  #SOO: PRM Modification
  tokenlevel_icm:  #SOO: token level ICM
    icm_intermediate_size: 8192
    lr: 1e-4
    lr_scheduler_type: "linear"
    warmup_steps: 0
    eta_token: 0.01
  answerlevel_icm:  #SOO: answer level ICM
    icm_intermediate_size: 8192
    lr: 1e-4
    lr_scheduler_type: "linear"
    warmup_steps: 0
    eta_answer: 0.1

trainer:
  project_name: verl-dapo
  save_curiosity_scores: False
