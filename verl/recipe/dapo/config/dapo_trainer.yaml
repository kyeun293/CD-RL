hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}
  # System message appended to prompts instructing the model to reason step by step.
  # Each step should be separated by step_sep (default: blank line).
  # Set to null to disable.
  step_instruction: "Please solve the problem by breaking your reasoning into detailed, granular steps. Use the following format and include as many steps as needed — do not skip or combine steps:\n\nStep 1: [your reasoning]\n\nStep 2: [your reasoning]\n\nStep 3: [your reasoning]\n\n(continue as needed)\n\nAt the end, output the final answer using the exact format: \\boxed{your_answer}."

reward:
  reward_manager:
    name: dapo
  reward_kwargs:
    overlong_buffer_cfg:
      enable: False # We try to avoid forgetting to set enable
      len: 0
      penalty_factor: 0.0
      log: False
    max_resp_len: null

algorithm:
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: False # We try to avoid forgetting to set enable
    metric: null # acc / score / seq_reward / seq_final_reward / ...
    max_num_gen_batches: 0 # Non-positive values mean no upper limit
  use_curiosity: True
  use_tokenlevel_curiosity: False  #SOO: token level ICM
  use_answerlevel_curiosity: False  #SOO: answer level ICM
  overload_actor_to_ref: False
  overload_actor_to_ref_freq: 40

actor_rollout_ref:
  use_curiosity: ${algorithm.use_curiosity}
  use_tokenlevel_curiosity: ${algorithm.use_tokenlevel_curiosity}  #SOO: token level ICM
  use_answerlevel_curiosity: ${algorithm.use_answerlevel_curiosity}  #SOO: answer level ICM
  step_sep: null # e.g. "Step"
  prm_model_path: null
  total_training_steps: null
  trust_remote_code: False
  ref_in_actor: False
  icm:
    icm_intermediate_size: 512
    lr: 1e-4
    lr_scheduler_type: "linear"
    warmup_steps: 0
    intrinsic_reward_token: "all_step_tokens" # "last_step_token" or "all_step_tokens"
    icm_calculation: "normalize" # "clip" or "normalize"
    eta: 0.5
    prm_mask: True  #SOO: PRM Modification
  tokenlevel_icm:  #SOO: token level ICM
    icm_intermediate_size: 8192
    lr: 1e-4
    lr_scheduler_type: "linear"
    warmup_steps: 0
    eta_token: 0.01
  answerlevel_icm:  #SOO: answer level ICM
    icm_intermediate_size: 8192
    lr: 1e-4
    lr_scheduler_type: "linear"
    warmup_steps: 0
    eta_answer: 0.1

trainer:
  project_name: verl-dapo
  save_curiosity_scores: False
